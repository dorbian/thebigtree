# BigTree Configuration for Local Development

[BOT]
# Discord bot settings (not needed for dev server)
token = your_discord_token_here
guildid = 1224347680776523847
adminid = 1317764277016199178

[WEB]
# Web server settings
listen_host = 0.0.0.0
listen_port = 8443
base_url = http://localhost:8443
serve_frontend = True

# API authentication (optional for dev)
api_keys = 
jwt_secret = dev-secret-change-in-production

[DATABASE]
# PostgreSQL connection settings
# Change these to point to your remote database
host = 127.0.0.1
port = 5432
user = bigtree
password = your_password_here
name = bigtree
sslmode = prefer
connect_timeout = 10
connect_retries = 5
connect_delay = 2.0
pool_min = 1
pool_max = 4

[XIVAUTH]
# FFXIV authentication (optional)
verify_url = 
api_key = 
client_id = 
client_secret = 

[openai]
# Language Services provider defaults (optional). Runtime edits are stored in PostgreSQL.
openai_api_key = none
enable_priest_chat = False
openai_model = gpt-4o-mini
openai_temperature = 0.7
openai_max_output_tokens = 1200
memory_enabled = True
memory_turns = 6
discord_context_enabled = False
discord_context_channel_ids = []
